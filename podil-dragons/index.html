    <nav class="footer-nav">
      <a href="#/sale" data-i18n="nav.sale"></a>
      <a href="#/reconstruction" data-i18n="nav.reconstruction"></a>
      <a href="#/about" data-i18n="nav.about"></a>
      <a href="#/contacts" data-i18n="nav.contacts"></a>
      <a href="#/settings" data-i18n="nav.settings"></a>
    </nav>
    <div class="footer-meta">
      <span>© <span id="year"></span> PODIL DRAGONS. <span data-i18n="footer.rights"></span> <span id="fCompany"></span></span>
      <a href="#/privacy" data-i18n="footer.privacy"></a>
      <button class="link-btn" type="button" id="toTop" data-i18n="footer.top"></button>
    </div>
  </div>
</footer>

<!-- Вікно оголошення -->
<div class="modal" id="detail" hidden>
  <div class="modal-back" data-close></div>
  <div class="modal-card modal-wide" role="dialog" aria-modal="true" aria-labelledby="dTitle">
    <button class="icon-btn modal-x" type="button" data-close data-i18n-title="d.close" title="Закрити">✕</button>
    <div class="detail modal-scroll" id="detailBody"></div>
  </div>
</div>

<!-- Форма нового оголошення -->
<div class="modal" id="formModal" hidden>
  <div class="modal-back" data-close></div>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="fTitle">
    <button class="icon-btn modal-x" type="button" data-close data-i18n-title="d.close" title="Закрити">✕</button>
    <form id="listForm" class="list-form modal-scroll" novalidate>
      <h2 id="fTitle" data-i18n="form.title"></h2>
      <p class="muted" data-i18n="form.sub"></p>
      <input class="hp" type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
      <fieldset class="type-pick">
        <legend data-i18n="form.type"></legend>
        <label><input type="radio" name="type" value="apartment" checked><span><svg viewBox="0 0 48 48"><use href="#ic-apartment"/></svg><b data-i18n="type.apartment"></b></span></label>
        <label><input type="radio" name="type" value="house"><span><svg viewBox="0 0 48 48"><use href="#ic-house"/></svg><b data-i18n="type.house"></b></span></label>
        <label><input type="radio" name="type" value="commercial"><span><svg viewBox="0 0 48 48"><use href="#ic-commercial"/></svg><b data-i18n="type.commercial"></b></span></label>
      </fieldset>
      <label class="full"><span data-i18n="form.name"></span><input name="title" required maxlength="120" data-i18n-ph="form.namePh"></label>
      <div class="row2">
        <label><span data-i18n="form.district"></span><select name="district" id="formDistrict" required></select></label>
        <label><span data-i18n="form.address"></span><input name="address" maxlength="120" data-i18n-ph="form.addressPh"></label>
      </div>
      <div class="row3">
        <label><span data-i18n="form.price"></span><input name="price" type="number" min="1" required inputmode="numeric"></label>
        <label><span data-i18n="form.area"></span><input name="area" type="number" min="1" step="0.1" required inputmode="decimal"></label>
        <label class="rooms-field"><span data-i18n="form.rooms"></span><input name="rooms" type="number" min="1" max="30" inputmode="numeric"></label>
      </div>
      <div class="row3">
        <label class="floor-field"><span data-i18n="form.floor"></span><input name="floor" type="number" min="-2" max="100" inputmode="numeric"></label>
        <label><span data-i18n="form.floors"></span><input name="floors" type="number" min="1" max="100" inputmode="numeric"></label>
        <label><span data-i18n="form.year"></span><input name="year" type="number" min="1700" max="2100" inputmode="numeric"></label>
      </div>
      <label class="full"><span data-i18n="form.desc"></span><textarea name="desc" rows="4" maxlength="3000" data-i18n-ph="form.descPh"></textarea></label>
      <p class="form-note full" data-i18n="form.note"></p>
      <div class="row2">
        <label><span data-i18n="form.contactName"></span><input name="contact" required maxlength="80" autocomplete="name"></label>
        <label><span data-i18n="form.phone"></span><input name="phone" type="tel" required maxlength="30" autocomplete="tel" placeholder="+380"></label>
      </div>
      <label class="check full"><input type="checkbox" name="kyiv" required><span data-i18n="form.kyiv"></span></label>
      <label class="check full"><input type="checkbox" name="consent" required><span><span data-i18n="form.consent"></span> <a href="#/privacy" data-close data-i18n="form.consentLink"></a> *</span></label>
      <p class="form-err" id="formErr" role="alert"></p>
      <div class="form-actions">
        <button class="btn btn-ghost" type="button" data-close data-i18n="form.cancel"></button>
        <button class="btn btn-red" type="submit" data-i18n="form.submit"></button>
      </div>
    </form>
  </div>
</div>

<!-- Нижня панель швидких дій — лише на телефонах -->
<nav class="mbar" aria-label="Quick actions">
  <a class="mb-btn" id="mbCall" href="#"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#ic-phone"/></svg><span data-i18n="d.call">Зателефонувати</span></a>
  <a class="mb-btn" href="#/sale"><svg viewBox="0 0 48 48" aria-hidden="true"><use href="#ic-apartment"/></svg><span data-i18n="nav.sale">Продаж</span></a>
  <button class="mb-btn mb-main" type="button" data-action="open-form"><span data-i18n="cta.list">Виставити об'єкт</span></button>
</nav>
<div class="nav-backdrop" aria-hidden="true"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="page-curtain" aria-hidden="true"></div>
