<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Линия фронта</title>
<meta name="description" content="Стратегия на реальной карте фронта DeepState: двигай линию фронта между Украиной и Россией — наступай, укрепляйся, окружай.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&family=Russo+One&display=swap">
<style>
  :root {
    color-scheme: dark;
    --bg: #0d1117;
    --panel: rgba(16, 21, 29, 0.94);
    --panel-2: #1a222e;
    --line: #2a3546;
    --ink: #e8edf4;
    --muted: #93a1b5;
    --ua: #3b82f6;
    --ua-2: #facc15;
    --ru: #e0352b;
    --grey: #8b8178;
    --ok: #34d399;
    --warn: #fbbf24;
    --head: "Russo One", "Rubik", system-ui, sans-serif;
    --body: "Rubik", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body { background: #0c141c; color: var(--ink); font: 14px/1.4 var(--body); -webkit-tap-highlight-color: transparent; }
  canvas#map { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  /* готовая карта: двигается и масштабируется видеокартой, без перерисовки */
  canvas#mapc { position: fixed; left: 0; top: 0; transform-origin: 0 0; pointer-events: none; will-change: transform; }
  canvas#map.paint { cursor: crosshair; }
  button { font: inherit; color: inherit; cursor: pointer; }
  a { color: #93c5fd; }

  #top { position: fixed; top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 10px;
    padding: calc(8px + env(safe-area-inset-top)) 12px 8px; background: linear-gradient(var(--panel), rgba(16,21,29,.75));
    border-bottom: 1px solid var(--line); z-index: 5; }
  .brand { font-family: var(--head); letter-spacing: .06em; font-size: 16px; white-space: nowrap; }
  .brand i { font-style: normal; color: var(--ru); }
  #clock { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #clock b { color: var(--ink); font-weight: 500; }
  .chip { display: inline-block; padding: 1px 8px; border-radius: 99px; background: var(--panel-2); border: 1px solid var(--line); font-size: 12px; margin-left: 6px; }
  .spacer { flex: 1; }
  .tbtn { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; }
  .tbtn:hover { border-color: #46566d; }
  .tbtn.on { background: #facc15; color: #111; border-color: #facc15; }

  #layers { position: fixed; top: 52px; right: 12px; z-index: 6; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; }
  #layers label { display: flex; gap: 8px; align-items: center; padding: 3px 0; cursor: pointer; }

  #side { position: fixed; top: 58px; right: 12px; bottom: 34px; width: 350px; z-index: 4; background: var(--panel);
    border: 1px solid var(--line); border-radius: 14px; display: flex; flex-direction: column; overflow: hidden; }
  #grab { display: none; }
  #sideBody { overflow-y: auto; padding: 14px; flex: 1; }
  #sideBody h2 { font-family: var(--head); font-size: 15px; margin: 0 0 10px; letter-spacing: .03em; font-weight: 400; }
  #sideBody h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 16px 0 8px; font-weight: 500; }
  .flag { display: inline-block; width: 18px; height: 12px; border-radius: 2px; vertical-align: -1px; margin-right: 6px; }
  .flag.ua { background: linear-gradient(#0057b7 50%, #ffd700 50%); }
  .flag.ru { background: linear-gradient(#fff 33%, #0039a6 33% 66%, #d52b1e 66%); }
  .res { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .res div { background: var(--panel-2); border-radius: 8px; padding: 6px 9px; }
  .res small { display: block; color: var(--muted); font-size: 11px; }
  .res b { font-weight: 500; font-size: 15px; }
  .stat { background: var(--panel-2); border-radius: 8px; padding: 8px 10px; margin-top: 6px; }
  .stat .big { font-size: 18px; font-weight: 500; }
  .up { color: var(--ok); } .down { color: #f87171; }
  .obj { display: flex; flex-wrap: wrap; gap: 6px; }
  .obj span { padding: 2px 8px; border-radius: 99px; background: var(--panel-2); border: 1px solid var(--line); font-size: 12px; }
  .obj span.done { border-color: var(--ok); color: var(--ok); }
  .obj span.lost { border-color: #f87171; color: #f87171; text-decoration: line-through; }
  .op { border: 1px solid #3d4c63; border-radius: 10px; padding: 10px; background: #141b25; }
  .tabs { display: flex; gap: 6px; margin: 8px 0; }
  .tabs button { flex: 1; padding: 6px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel-2); }
  .tabs button.on { background: #24324a; border-color: #4b6a9b; }
  .tabs.grid { display: grid; grid-template-columns: 1fr 1fr; }
  .tabs.grid3 { display: grid; grid-template-columns: 1fr 1.25fr 1.15fr; }
  .drow { display: flex; gap: 10px; align-items: center; text-align: left; width: 100%; padding: 7px 8px; margin-bottom: 5px; border-radius: 9px; border: 1px solid var(--line); background: var(--panel-2); }
  .drow small { display: block; color: var(--muted); font-size: 11.5px; }
  .op .drow { border: 0; background: none; padding: 0; margin-bottom: 8px; }
  svg.nato { width: 34px; height: 34px; flex: none; }
  .ammo { display: flex; gap: 5px; flex-wrap: wrap; } .ammo i { width: 18px; height: 8px; border-radius: 4px; background: #2a3546; } .ammo i.on { background: #facc15; }
  .modes button b svg.nato { width: 22px; height: 22px; vertical-align: middle; }
  .tools button svg.nato { width: 22px; height: 22px; vertical-align: middle; }
  label.bar { display: block; font-size: 12.5px; margin: 6px 0; }
  label.bar progress { display: block; width: 100%; height: 8px; accent-color: #60a5fa; }
  .pk { padding: 8px 10px; border-radius: 9px; background: var(--panel-2); margin-bottom: 6px; font-size: 13px; border-left: 3px solid #f87171; }
  .pk.good { border-left-color: #34d399; }
  .pk small { display: block; color: var(--muted); margin: 2px 0 6px; }
  .pk .btn { padding: 4px 10px; flex: none; }
  .tabs button:disabled { opacity: .35; cursor: default; }
  .res2 { display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 6px; font-size: 12.5px; color: #c3cddb; }
  .qin { flex: 1; min-width: 0; background: var(--panel-2); color: var(--ink); border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; font: inherit; }
  .sl { display: grid; grid-template-columns: 92px 1fr 64px; align-items: center; gap: 8px; margin: 6px 0; font-size: 13px; }
  .sl output { text-align: right; font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: #60a5fa; }
  .est { margin: 8px 0; padding: 8px; border-radius: 8px; background: var(--panel-2); font-size: 13px; }
  .prow { display: flex; justify-content: space-between; gap: 8px; padding: 2px 0; }
  .prow span { color: var(--muted); }
  .row { display: flex; gap: 8px; }
  .btn { flex: 1; padding: 9px 12px; border-radius: 9px; border: 1px solid var(--line); background: var(--panel-2); font-weight: 500; }
  .btn.primary { background: #1d4ed8; border-color: #3b82f6; }
  .btn.red { background: #9f1d17; border-color: var(--ru); }
  .btn:disabled { opacity: .45; cursor: default; }
  .orders { list-style: none; padding: 0; margin: 0; }
  .orders li { display: flex; align-items: center; gap: 8px; padding: 6px 8px; background: var(--panel-2); border-radius: 8px; margin-bottom: 5px; font-size: 13px; }
  .orders li span { flex: 1; }
  .orders li button { background: none; border: 0; color: var(--muted); font-size: 16px; padding: 0 4px; }
  .log { font-size: 12.5px; color: #c3cddb; }
  .log p { margin: 0 0 5px; padding-left: 8px; border-left: 3px solid var(--line); }
  .log p.s1 { border-color: var(--ua); } .log p.s2 { border-color: var(--ru); } .log p.ev { border-color: var(--warn); }
  .muted { color: var(--muted); }
  .hint { font-size: 12.5px; color: var(--muted); margin: 6px 0; }
  .tools { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .tools button { padding: 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel-2); }
  .tools button.on { outline: 2px solid #93c5fd; }
  .sw { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }

  #credit { position: fixed; left: 8px; bottom: calc(6px + env(safe-area-inset-bottom)); z-index: 3; font-size: 11px; color: #9aa6b8;
    background: rgba(11,15,21,.8); padding: 2px 7px; border-radius: 5px; }
  #credit a { color: #93c5fd; }
  #legend { position: fixed; left: 8px; bottom: 30px; z-index: 3; font-size: 11.5px; color: #d6dde8; background: rgba(11,15,21,.85); border: 1px solid var(--line);
    padding: 6px 9px; border-radius: 8px; line-height: 1.6; }

  #modal { position: fixed; inset: 0; z-index: 20; background: rgba(5,8,12,.62); display: flex; align-items: center; justify-content: center; padding: 16px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; width: min(560px, 100%); max-height: calc(100vh - 32px); overflow-y: auto; padding: 22px; }
  .card h1 { font-family: var(--head); font-weight: 400; font-size: 28px; margin: 0; letter-spacing: .04em; }
  .card h1 i { font-style: normal; color: var(--ru); }
  .card .sub { color: var(--muted); margin: 4px 0 16px; }
  .src { background: var(--panel-2); border-radius: 10px; padding: 10px 12px; font-size: 13px; margin-bottom: 14px; }
  .src .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: var(--warn); }
  .src .dot.ok { background: var(--ok); }
  .modes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .modes button { text-align: left; padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel-2); }
  .modes button:hover { border-color: #4b6a9b; }
  .modes button b { display: block; font-size: 15px; margin-bottom: 2px; }
  .modes button small { color: var(--muted); }
  .card details { margin-top: 14px; font-size: 13px; color: #c3cddb; }
  .card summary { cursor: pointer; color: var(--ink); }
  .card select { background: var(--panel-2); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; font: inherit; }
  .rep p { margin: 0 0 6px; }
  /* стартовое меню как в GeoFront: тёмная панель слева, справа живая карта */
  #modal.gm { justify-content: flex-start; align-items: stretch; padding: 0; background: linear-gradient(90deg, rgba(5,8,12,.25), rgba(5,8,12,.45)); }
  #modal.gm .card { width: min(500px, 100%); max-height: none; height: 100%; border: 0; border-radius: 0; background: #0b0f15; padding: 0;
    display: flex; flex-direction: column; position: relative; overflow: visible; box-shadow: 8px 0 40px rgba(0,0,0,.5); }
  #modal.gm .card::after { content: ""; position: absolute; top: 0; right: -3px; width: 3px; height: 100%; background: linear-gradient(#2563eb, #7c3aed 50%, #dc2626); }
  .gmw { padding: 24px 28px 8px; flex: 1; overflow-y: auto; }
  .gmhead { padding: 34px 28px 22px; }
  .gmlogo { width: 64px; height: 64px; border-radius: 50%; margin-bottom: 14px; display: block; }
  .gmhead h1 { font-family: var(--head); font-weight: 400; font-style: italic; font-size: 40px; letter-spacing: .02em; margin: 0; line-height: 1.05; }
  .gmhead h1 i { color: var(--ru); } .gmhead .sub { color: var(--muted); margin: 6px 0 0; font-size: 14px; }
  .gml { display: flex; flex-direction: column; border-top: 1px solid #1c2430; }
  .gmi { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; text-align: left; background: none; border: 0;
    border-bottom: 1px solid #1c2430; border-radius: 0; padding: 17px 28px; font-size: 19px; color: var(--ink); transition: background .15s, padding .15s; }
  .gmi:hover { background: #121a26; padding-left: 34px; } .gmi small { display: block; color: var(--muted); font-size: 12.5px; margin-top: 2px; }
  .gmi .ic { font-size: 20px; opacity: .85; flex: none; } .gmi.primary { color: #93c5fd; } .gmi.primary .ic { color: #60a5fa; }
  .gmfoot { margin-top: auto; padding: 16px 28px 18px; display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: 12px; gap: 10px; }
  .gmfoot .lang { border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; color: var(--ink); white-space: nowrap; }
  .gmfoot .lang b { color: #93c5fd; font-weight: 600; }
  #modal.gm .gmw .mback { margin-bottom: 14px; }
  .mmain { display: flex; flex-direction: column; gap: 8px; text-align: center; }
  .mmain h1 { font-size: 34px; } .mmain .sub { margin-bottom: 10px; }
  .mbig { padding: 13px 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel-2); font-size: 16px; font-weight: 500; text-align: left; }
  .mbig small { display: block; color: var(--muted); font-size: 12.5px; font-weight: 400; margin-top: 2px; }
  .mbig:hover { border-color: #4b6a9b; } .mbig.primary { background: #1d4ed8; border-color: #3b82f6; }
  .mfoot { color: var(--muted); font-size: 11.5px; margin-top: 6px; }
  .mback { background: none; border: 0; color: #93c5fd; padding: 0; margin-bottom: 8px; font-size: 14px; }
  .mh { font-family: var(--head); font-weight: 400; font-size: 22px; margin: 0 0 12px; }
  .scl { display: grid; gap: 6px; } .scl button { text-align: left; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel-2); }
  .scl button small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; } .scl button.on { border-color: #60a5fa; background: #1b2a42; }
  .help p { font-size: 13.5px; color: #c3cddb; }

  #toast { position: fixed; left: 50%; top: 64px; transform: translateX(-50%); z-index: 30; background: #111827; border: 1px solid var(--line);
    padding: 8px 14px; border-radius: 10px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 90vw; }
  #toast.on { opacity: 1; }
  #tip { position: fixed; z-index: 8; pointer-events: none; background: rgba(17,24,39,.92); border: 1px solid var(--line); border-radius: 8px;
    padding: 5px 8px; font-size: 12px; display: none; white-space: nowrap; }

  @media (max-width: 760px) {
    .brand { font-size: 13px; }
    #clock { font-size: 11.5px; }
    .tbtn { padding: 5px 9px; font-size: 13px; }
    #side { left: 0; right: 0; bottom: 0; top: auto; width: auto; height: 46vh; border-radius: 16px 16px 0 0; padding-bottom: env(safe-area-inset-bottom); transition: height .2s; }
    #side.min { height: 92px; }
    #grab { display: block; height: 22px; border: 0; background: none; width: 100%; flex: none; }
    #grab::before { content: ""; display: block; margin: 0 auto; width: 44px; height: 4px; border-radius: 4px; background: #4b5563; }
    #sideBody { padding-top: 0; }
    #credit { bottom: auto; top: calc(48px + env(safe-area-inset-top)); left: 6px; font-size: 10px; }
    #legend { display: none; }
    .modes { grid-template-columns: 1fr; }
  }
</style>
</head>

<canvas id="mapc"></canvas>
<canvas id="map"></canvas>

<div id="top">
  <div class="brand">ЛИНИЯ <i>ФРОНТА</i></div>
  <div id="clock"></div>
  <div class="spacer"></div>
  <button class="tbtn" id="bPause" hidden title="Пауза">⏸</button>
  <button class="tbtn" id="bRuler" title="Линейка">📏</button>

  <button class="tbtn" id="bMenu">Меню</button>
</div>

<div id="layers" hidden>
  <label><input type="checkbox" data-l="units" checked> Отряды на фронте</label>
  <label><input type="checkbox" data-l="assets" checked> Аэродромы и порты</label>
  <label><input type="checkbox" data-l="forts" checked> Укрепления</label>

  <span class="sw" style="background:#1a2d4a;border:1px solid #4f7fc9"></span>Украина<br>
  <span class="sw" style="background:#8b2727"></span>Россия и занятое РФ<br>
  <span class="sw" style="background:#5e5650"></span>Серая зона<br>
  <span class="sw" style="background:#2a56a8"></span>Отбито ВСУ за игру<br>
  <span class="sw" style="background:#b01a18"></span>Занято РФ за игру<br>
  ✈ аэродром · ⚓ порт · ● войска
</div>
<div id="credit">Линия фронта: <a href="https://deepstatemap.live" target="_blank" rel="noopener">DeepStateMAP.live</a> <span id="credDate"></span> · Карта: Natural Earth</div>

<div id="modal" hidden><div class="card" id="modalCard"></div></div>
<div id="toast"></div>
<div id="tip"></div>

<script src="geo.js"></script>
<script>
'use strict';
const GEO = window.GEO;

/* ================= Сетка =================
   Поле — сетка ~2,2 × 2,2 км в проекции Меркатора. Каждая клетка: страна, владелец,
   город, река, укрепления. Все расчёты (бои, окружения, линия фронта) идут по клеткам. */
const BB = { w: 20, e: 50, s: 41, n: 60 }; // игровая область: от Польши до Волги, от Турции до Петербурга
const CD = 0.035, RAD = Math.PI / 180;
const CM = CD * RAD, X0 = BB.w * RAD, Y0 = Math.log(Math.tan(Math.PI / 4 + BB.n * RAD / 2));
const COLS = Math.round((BB.e - BB.w) / CD);
const ROWS = Math.ceil((Y0 - Math.log(Math.tan(Math.PI / 4 + BB.s * RAD / 2))) / CM);
const N = COLS * ROWS;
const U = lon => (lon * RAD - X0) / CM;
const V = lat => (Y0 - Math.log(Math.tan(Math.PI / 4 + lat * RAD / 2))) / CM;
const LON = u => (X0 + u * CM) / RAD;
const LAT = v => (2 * Math.atan(Math.exp(Y0 - v * CM)) - Math.PI / 2) / RAD;
const rowKm2 = new Float32Array(ROWS);
for (let j = 0; j < ROWS; j++) { const c = Math.cos(LAT(j + .5) * RAD) * CD * 111.32; rowKm2[j] = c * c; }

const UA = 1, RU = 2, GREY = 3;
const UKR_AREA = 603628;
const country = new Uint8Array(N);   // 0 вода/вне поля, 1 Украина, 2 Россия, 3 нейтральные
const owner = new Uint8Array(N);     // 0 нет, 1 ВСУ, 2 ВС РФ, 3 серая зона
const owner0 = new Uint8Array(N);    // владелец на начало игры
const urban = new Uint8Array(N), river = new Uint8Array(N), fort = new Uint8Array(N);
const changed = new Uint16Array(N), cut = new Uint8Array(N), distF = new Uint16Array(N);
const isFront = new Uint8Array(N);
const land = k => country[k] !== 0;                    // любая суша (в свободном режиме можно захватить что угодно)
const uaRu = k => country[k] === 1 || country[k] === 2; // Украина или Россия
const cellAt = (u, v) => { const i = Math.floor(u), j = Math.floor(v); return (i < 0 || j < 0 || i >= COLS || j >= ROWS) ? -1 : j * COLS + i; };
const R = 9; // радиус операции в клетках (~20 км)
const DISK = [];
for (let dj = -R; dj <= R; dj++) for (let di = -R; di <= R; di++) if (di * di + dj * dj <= R * R) DISK.push([di, dj]);

const SIDE = {
  1: { short: 'ВСУ', name: 'Украина', gen: 'Украину', flag: 'ua', color: '#2563eb' },
  2: { short: 'ВС РФ', name: 'Россия', gen: 'Россию', flag: 'ru', color: '#d62f27' },
};
const fmt = n => Math.round(n).toLocaleString('ru-RU');
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const rnd = (a, b) => a + Math.random() * (b - a);

/* ================= Города ================= */
const CITIES = [
  ['Киев', 50.45, 30.52, 3], ['Харьков', 49.99, 36.23, 3], ['Днепр', 48.46, 35.05, 3], ['Запорожье', 47.84, 35.14, 3],

/* ================= Растеризация ================= */
function rasterPolys(polys, cb) {
  for (const poly of polys) {
    const rowsX = new Map();
    for (const ring of poly) {
      const n = ring.length;
      for (let a = 0; a < n; a++) {
        const p = ring[a], q = ring[(a + 1) % n];
        const u0 = U(p[0]), v0 = V(p[1]), u1 = U(q[0]), v1 = V(q[1]);
        if (v0 === v1) continue;
        const j0 = Math.max(0, Math.ceil(Math.min(v0, v1) - .5)), j1 = Math.min(ROWS - 1, Math.ceil(Math.max(v0, v1) - .5) - 1);
        for (let j = j0; j <= j1; j++) {
          const uc = u0 + (j + .5 - v0) / (v1 - v0) * (u1 - u0);
          let arr = rowsX.get(j); if (!arr) rowsX.set(j, arr = []); arr.push(uc);
        }
      }
    }
    for (const [j, arr] of rowsX) {
      arr.sort((a, b) => a - b);
      for (let t = 0; t + 1 < arr.length; t += 2) {
        const i0 = Math.max(0, Math.ceil(arr[t] - .5)), i1 = Math.min(COLS - 1, Math.ceil(arr[t + 1] - .5) - 1);
        for (let i = i0; i <= i1; i++) cb(j * COLS + i);
      }
    }
  }
}
function rasterLine(line, w, cb) {
  for (let a = 0; a + 1 < line.length; a++) {
    const u0 = U(line[a][0]), v0 = V(line[a][1]), u1 = U(line[a + 1][0]), v1 = V(line[a + 1][1]);
    const steps = Math.ceil(Math.hypot(u1 - u0, v1 - v0) / .3) + 1;
    for (let s = 0; s <= steps; s++) {
      const u = u0 + (u1 - u0) * s / steps, v = v0 + (v1 - v0) * s / steps;
      for (let dj = -w; dj <= w; dj++) for (let di = -w; di <= w; di++) { const k = cellAt(u + di, v + dj); if (k >= 0) cb(k); }
    }
  }
}

const BIG_RIVER = /^(Dnipro|Dnieper|Днепр)$/;
const MID_RIVER = /^(Donets|Северский Донец|Оскол|Desna|Десна|Southern Bug|Seym|Don|Dniester|Psel|Vorskla|Ворскла|Псёл)$/;
function buildBase() {
  for (const [a, code] of [['NEU', 3], ['RUS', 2], ['UKR', 1]])
    if (GEO.countries[a]) rasterPolys(GEO.countries[a], k => { country[k] = code; });
  for (const l of GEO.lakes) {
    if (/Kakhovka/.test(l.n)) rasterPolys(l.p, k => { if (land(k)) river[k] = Math.max(river[k], 1); }); // осушенное водохранилище — пойма
    else rasterPolys(l.p, k => { country[k] = 0; });
  }
  for (const r of GEO.rivers) {
    const lvl = BIG_RIVER.test(r.n) ? 2 : MID_RIVER.test(r.n) ? 1 : 0;
    if (!lvl) continue;
    for (const ln of r.l) rasterLine(ln, lvl === 2 ? 1 : 0, k => { if (land(k)) river[k] = Math.max(river[k], lvl); });
  }
  const snapLand = c => { // точка попала в реку/море — сдвигаем на ближайшую сушу
    if (c.k >= 0 && land(c.k)) return;
    let best = -1, bd = 1e9;
    for (let dj = -4; dj <= 4; dj++) for (let di = -4; di <= 4; di++) { const k = cellAt(c.u + di, c.v + dj); if (k >= 0 && land(k) && di * di + dj * dj < bd) { bd = di * di + dj * dj; best = k; } }
    c.k = best;
  };
  ASSETS.forEach(snapLand);
  CITIES.forEach(c => {
    snapLand(c);
    const rr = [0, 1.3, 2.3, 3.6][c.size];
    for (let dj = -4; dj <= 4; dj++) for (let di = -4; di <= 4; di++) {
      if (di * di + dj * dj > rr * rr) continue;
      const k = cellAt(c.u + di, c.v + dj); if (k >= 0 && land(k)) urban[k] = Math.max(urban[k], c.size);
    }
  });
}

/* ================= Линия фронта DeepState ================= */
const OCC = /status\.occupied|territories\.(crimea|ordlo|tuzla)/, UNK = /status\.unknown/, LIB = /status\.dismissed/;
function parseDeepState(js) {
  const fc = js && js.map && js.map.features ? js.map : js;
  if (!fc || !Array.isArray(fc.features)) throw new Error('Не похоже на карту DeepState');
  const out = { occ: [], unk: [], lib: [], ato: [], id: js.id };
  for (const f of fc.features) {
    const g = f.geometry; if (!g) continue;
    const name = (f.properties && f.properties.name) || '';
    const kind = OCC.test(name) ? 'occ' : UNK.test(name) ? 'unk' : LIB.test(name) ? 'lib' : null;
    if (!kind) continue;
    const polys = g.type === 'Polygon' ? [g.coordinates] : g.type === 'MultiPolygon' ? g.coordinates : [];
    out[kind].push(...polys);
    if (/territories\.(crimea|ordlo|tuzla)/.test(name)) out.ato.push(...polys);
  }
  if (!out.occ.length) throw new Error('В файле нет оккупированных территорий');
  const t = Number(js.id);
  out.date = t > 1.5e9 && t < 4e9 ? new Date(t * 1000) : new Date();
  return out;
}
function applyFront(fd) {
  for (let k = 0; k < N; k++) owner[k] = country[k] === 1 ? UA : country[k] === 2 ? RU : 0;
  rasterPolys(fd.occ, k => { if (uaRu(k)) owner[k] = RU; });
  rasterPolys(fd.unk, k => { if (uaRu(k)) owner[k] = GREY; });
  normalizeMap();
}
function initForts() {
  fort.fill(0);
  computeFront(); computeDist();
  for (let k = 0; k < N; k++) {
    if (!land(k) || owner[k] === GREY) continue;
    const d = distF[k], j = (k / COLS) | 0, lat = LAT(j + .5), lon = LON(k % COLS + .5);
    if (d <= 2) fort[k] = 1;                                                         // окопы вдоль всего фронта
    if (owner[k] === RU && lat < 47.75 && lon > 33.6 && lon < 37.6 && d >= 3 && d <= 12) fort[k] = 2; // «линия Суровикина»
  }
  // «пояс крепостей» Славянск — Краматорск — Дружковка — Константиновка
  for (const name of ['Славянск', 'Краматорск', 'Дружковка', 'Константиновка']) {
    const c = CITIES.find(c => c.name === name);
    for (const [di, dj] of DISK) {
      if (di * di + dj * dj > 30) continue;
      const k = cellAt(c.u + di, c.v + dj); if (k >= 0 && owner[k] === UA) fort[k] = Math.max(fort[k], 2);
    }
  }
}

/* ================= Расчёт состояния ================= */
const frontList = { 1: [], 2: [] };
function computeFront() {
  const f1 = [], f2 = [];
  isFront.fill(0);
  for (let k = 0; k < N; k++) {
    const o = owner[k]; if (o !== UA && o !== RU) continue;
    const i = k % COLS; let m;
    if ((i > 0 && (m = owner[k - 1]) && m !== o) || (i < COLS - 1 && (m = owner[k + 1]) && m !== o) ||
        (k >= COLS && (m = owner[k - COLS]) && m !== o) || (k < N - COLS && (m = owner[k + COLS]) && m !== o)) { isFront[k] = 1; (o === UA ? f1 : f2).push(k); }
  }
  frontList[1] = f1; frontList[2] = f2;
}
const Q = new Int32Array(N);
function computeDist() {
  distF.fill(65535);
  let h = 0, t = 0;
  for (let k = 0; k < N; k++) if (isFront[k]) { distF[k] = 0; Q[t++] = k; }
  while (h < t) {
    const k = Q[h++], d = distF[k] + 1, i = k % COLS;
    let n;
    if (i > 0 && country[n = k - 1] && distF[n] > d) { distF[n] = d; Q[t++] = n; }
    if (i < COLS - 1 && country[n = k + 1] && distF[n] > d) { distF[n] = d; Q[t++] = n; }
    if (k >= COLS && country[n = k - COLS] && distF[n] > d) { distF[n] = d; Q[t++] = n; }
    if (k < N - COLS && country[n = k + COLS] && distF[n] > d) { distF[n] = d; Q[t++] = n; }
  }
}

// поле «не под контролем ВСУ» (1) / «под контролем ВСУ» (0) → изолиния 0.5 = линия фронта
const field = new Int8Array(N);
let frontPath = new Path2D(), fortPath = { 1: new Path2D(), 2: new Path2D() };
function buildContour() {
  let h = 0, t = 0;
  for (let k = 0; k < N; k++) {
    const o = country[k] ? owner[k] : 0;
    const f = o === UA ? 0 : (o === RU || o === GREY) ? 1 : -1;
    field[k] = f; if (f >= 0) Q[t++] = k;
  }
  while (h < t) { // вода и нейтральные клетки берут значение ближайшей суши — чтобы линия не шла по побережью
    const k = Q[h++], f = field[k], i = k % COLS;
    let n;
    if (i > 0 && field[n = k - 1] < 0) { field[n] = f; Q[t++] = n; }
    if (i < COLS - 1 && field[n = k + 1] < 0) { field[n] = f; Q[t++] = n; }
    if (k >= COLS && field[n = k - COLS] < 0) { field[n] = f; Q[t++] = n; }
    if (k < N - COLS && field[n = k + COLS] < 0) { field[n] = f; Q[t++] = n; }
  }
  // отрезки изолинии (marching squares) в полуклетках: целые координаты удобно сшивать
  const seg = [];
  const add = (x1, y1, x2, y2) => seg.push(x1, y1, x2, y2);
  for (let j = 0; j < ROWS - 1; j++) for (let i = 0; i < COLS - 1; i++) {
    const k = j * COLS + i;
    const c = field[k] * 8 + field[k + 1] * 4 + field[k + COLS + 1] * 2 + field[k + COLS];
    if (c === 0 || c === 15) continue;
    let l0 = false, l1 = false; // только там, где на суше встречаются обе стороны (иначе линии уходят в море)
    for (const n of [k, k + 1, k + COLS, k + COLS + 1]) if (country[n] && owner[n]) { if (owner[n] === UA) l0 = true; else l1 = true; }
    if (!l0 || !l1) continue;
    const Tx = 2 * i + 2, Ty = 2 * j + 1, Rx = 2 * i + 3, Ry = 2 * j + 2, Bx = 2 * i + 2, By = 2 * j + 3, Lx = 2 * i + 1, Ly = 2 * j + 2;
    switch (c) {
      case 1: case 14: add(Lx, Ly, Bx, By); break;
      case 2: case 13: add(Bx, By, Rx, Ry); break;
      case 3: case 12: add(Lx, Ly, Rx, Ry); break;
      case 4: case 11: add(Tx, Ty, Rx, Ry); break;
      case 6: case 9: add(Tx, Ty, Bx, By); break;
      case 7: case 8: add(Lx, Ly, Tx, Ty); break;
      case 5: add(Lx, Ly, Tx, Ty); add(Bx, By, Rx, Ry); break;
      case 10: add(Lx, Ly, Bx, By); add(Tx, Ty, Rx, Ry); break;
    }
  }
  frontPath = smoothLines(seg);
  const fp = { 1: new Path2D(), 2: new Path2D() };
  for (let k = 0; k < N; k++) {
    const f = fort[k], o = owner[k]; if (!f || (o !== UA && o !== RU)) continue;
    const u = k % COLS + .5, v = ((k / COLS) | 0) + .5, w = .16 + .12 * f;
    fp[o].moveTo(u - w, v); fp[o].lineTo(u + w, v);
    if (f >= 2) { fp[o].moveTo(u, v - w); fp[o].lineTo(u, v + w); }
  }
  fortPath = fp;
}
// Сшивает отрезки в ломаные и сглаживает их (Чайкин), чтобы линия фронта шла плавно, а не лесенкой
function smoothLines(seg) {

  }
  const walk = (s0, x, y, out) => { // идёт от точки (x, y), пока есть продолжение
    for (;;) {

function bindFile() {
  const fi = $('fileIn');
  if (fi) fi.onchange = async () => {
    const f = fi.files[0]; if (!f) return;
    try {
      let txt = await f.text();
      const m = txt.match(/<pre[^>]*>([\s\S]*)<\/pre>/i); if (m) txt = m[1].replace(/&quot;/g, '"').replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>');
      const fd = parseDeepState(JSON.parse(txt)); fd.src = 'file'; FRONT_NOW = fd; SCEN.id = 'now'; setFront(fd); toast('Карта DeepState загружена');
    } catch (e) { toast('Не удалось прочитать файл: ' + e.message); }
    showMenu('scen');
  };
}

    if (LOADING || !FRONT || (SCEN.id === 'hist' && FRONT.src !== 'hist')) return toast('Сначала выберите дату в сценарии «Фронт на любую дату».');
    startOperator(MS_OP.side, el.dataset.opgo);
  });
  if ($('diff')) $('diff').onchange = e => { MS.diff = e.target.value; };
  if ($('tmode')) $('tmode').onchange = e => { MS.rt = +e.target.value; };
  if ($('histDate')) $('histDate').onchange = e => { SCEN.date = e.target.value; if (SCEN.date) loadHist(SCEN.date); };
  if ($('srcBox')) { bindFile(); refreshMenuSrc(); }
  if ($('setFill')) $('setFill').oninput = e => { SET.fill = +e.target.value / 100; $('setFillO').textContent = e.target.value + '%'; saveSet(); buildImage(); invalidate(); };
  if ($('setSpeed')) $('setSpeed').oninput = e => { SET.aspeed = +e.target.value; $('setSpeedO').textContent = e.target.value + '×'; saveSet(); };
  if ($('bExport')) $('bExport').onclick = () => {
    save(); let txt = null; try { txt = localStorage.getItem(saveKeyFor(S.mode)); } catch (e) { }
    if (!txt) return toast('Нечего сохранять');
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([txt], { type: 'application/json' }));
    a.download = S.mode === 'editor' ? 'linia-fronta-svobodnyj.json' : 'linia-fronta-kampaniya.json'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  };
  if ($('importIn')) $('importIn').onchange = async e => {
    try { const txt = await e.target.files[0].text(), d = JSON.parse(txt); const key = saveKeyFor(d.S && d.S.mode); localStorage.setItem(key, txt); if (load(key)) { closeModal(); toast('Игра загружена'); } else toast('Файл не подходит'); }
    catch (err) { toast('Не удалось загрузить: ' + err.message); }
  };
  if ($('bWipe')) $('bWipe').onclick = () => { if (confirm('Удалить все сохранения?')) { try { for (const k of [SAVE_KEY, FREE_KEY, LAST_KEY]) localStorage.removeItem(k); } catch (e) { } toast('Сохранения удалены'); showMenu('settings'); } };
  if ($('bResume')) $('bResume').onclick = closeModal;
  if ($('bLoad')) $('bLoad').onclick = () => { if (S) save(); if (load(SAVE_KEY)) closeModal(); else toast('Сохранение повреждено'); };
  if ($('bLoadFree')) $('bLoadFree').onclick = () => { if (S) save(); if (load(FREE_KEY)) closeModal(); else toast('Сохранение повреждено'); };
}
function showReport(rep) {
  const p = S.player, net = rep.gained[p] - rep.gained[3 - p];
  const lines = rep.lines.slice().sort((a, b) => (a.s === p ? 0 : 1) - (b.s === p ? 0 : 1));
  openModal(`<h1 style="font-size:22px">Итоги недели ${S.turn}</h1>
    <div class="sub">${dateStr(S.date)} · ${season(S.date).name}</div>
    <div class="stat"><div class="big ${net >= 0 ? 'up' : 'down'}">${net >= 0 ? '+' : ''}${fmt(net)} км²</div><small class="muted">Ваши продвижения: ${fmt(rep.gained[p])} км² · противника: ${fmt(rep.gained[3 - p])} км²</small></div>
    <div class="log rep" style="margin-top:12px">${lines.map(l => `<p class="${l.ev ? 'ev' : 's' + l.s}">${l.t}</p>`).join('') || '<p>Тихая неделя: активных действий не было.</p>'}</div>
    <button class="btn primary" style="width:100%;margin-top:12px" id="bOk">Продолжить</button>`);
  $('bOk').onclick = closeModal;
}
function showEnd(title, why) {
  const p = S.player, s = S.sides[p];
  openModal(`<h1>${title}</h1><div class="sub">${why}</div>${statBlock()}
    <div class="stat">Недель: ${S.turn} · потери ${SIDE[p].short}: ${fmt(s.lossP)} чел., ${fmt(s.lossA)} ед. техники · противник: ${fmt(S.sides[3 - p].lossP)} чел.</div>
    <div class="row" style="margin-top:12px"><button class="btn primary" id="bNew">Новая игра</button><button class="btn" id="bLook">Смотреть карту</button></div>`);
  $('bNew').onclick = () => showMenu(); $('bLook').onclick = closeModal;
}

/* ================= Сохранение ================= */
const SAVE_KEY = 'frontline-save-v3';
// сжатие повторов: карта большая, без него сохранение не влезает в хранилище браузера
const rleEnc = a => { const o = []; let v = a[0], c = 0; for (let i = 0; i < a.length; i++) { if (a[i] === v) c++; else { o.push(v, c); v = a[i]; c = 1; } } o.push(v, c); return o.join(','); };
const rleDec = (str, a) => { const x = str.split(',').map(Number); let p = 0; for (let i = 0; i < x.length; i += 2) { a.fill(x[i], p, p + x[i + 1]); p += x[i + 1]; } };
const toB64 = a => { const u = new Uint8Array(a.buffer, a.byteOffset, a.byteLength); let s = ''; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); };
const fromB64 = (s, T) => { const b = atob(s), u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return new T(u.buffer); };
// У свободного режима своё сохранение, чтобы кампания его не затирала (и наоборот).
// LAST_KEY помнит, во что играли последним, — после перезагрузки страницы игра продолжает именно это.
const FREE_KEY = 'frontline-free-v1', LAST_KEY = 'frontline-last';
const saveKeyFor = mode => mode === 'editor' ? FREE_KEY : SAVE_KEY;
const hasSaveFor = key => { try { return !!localStorage.getItem(key); } catch (e) { return false; } };
function save() {
  if (!S || S.mode === 'op') return;
  try {
    const st = Object.assign({}, S, { sel: null, draft: null, ed: { side: ED.side, tool: ED.tool, paint: ED.paint, size: ED.size } });
    const key = saveKeyFor(S.mode);
    localStorage.setItem(key, JSON.stringify({ N, S: st, stats0: STATS0, frontDate: +FRONT.date,
      owner: rleEnc(owner), owner0: rleEnc(owner0), fort: rleEnc(fort), changed: rleEnc(changed), cut: rleEnc(cut), grace: rleEnc(grace) }));
    localStorage.setItem(LAST_KEY, key);
  } catch (e) { /* хранилище недоступно — игра просто не сохранится */ }
}
let saveT = 0;
function saveSoon() { clearTimeout(saveT); saveT = setTimeout(save, 700); }
function load(key = SAVE_KEY) {
  try {
    const d = JSON.parse(localStorage.getItem(key));
    if (!d || d.N !== N) return false;
    stopAuto(); ATK = null; LASSO = null; ED.undo = [];
    rleDec(d.owner, owner); rleDec(d.owner0, owner0); rleDec(d.fort, fort); rleDec(d.changed, changed); rleDec(d.cut, cut); rleDec(d.grace, grace);
    S = d.S; STATS0 = d.stats0;
    if (S.ed) Object.assign(ED, S.ed);
    for (const sd of [UA, RU]) { const def = newSide(sd); for (const key in def) if (S.sides[sd][key] == null) S.sides[sd][key] = def[key]; }
    S.divs = S.divs || { 1: [], 2: [] }; S.sbu = S.sbu || []; S.pockets = S.pockets || { 1: [], 2: [] }; S.divId = S.divId || 1; S.tab = S.tab || 'orders'; S.dmode = ''; S.droute = null;
    try { localStorage.setItem(LAST_KEY, key); } catch (e) { }
    recompute(); renderAll();
    if (S.mode === 'editor' && !S.sbu.length) sbuAuto(); // старое сохранение без дивизий — расставляем
    return true;
  } catch (e) { return false; }
}
// вкладку свернули или закрывают — сохраняем сразу (в том числе посреди атаки в свободном режиме)
addEventListener('visibilitychange', () => { if (document.hidden) save(); });
addEventListener('pagehide', save);

/* ================= Запуск ================= */
function setFront(fd) {
  FRONT = fd;
  $('credDate').textContent = (fd.src === 'hist' ? '· архив ' : fd.src === 'scen' ? '· сценарий ' : '· ') + new Date(fd.date).toLocaleDateString('ru-RU');
  if (!S || S.over) { applyFront(fd); owner0.set(owner); initForts(); recompute(); }
}
let menuShift = 0;
async function boot() {
  buildBase(); buildPaths(); resize();
  addEventListener('resize', resize);
  $('bMenu').onclick = () => showMenu();
  $('modal').onclick = e => { if (e.target === $('modal') && $('modal').classList.contains('gm') && S && !S.over) closeModal(); };
  $('bPause').onclick = () => { RT.paused = !RT.paused; renderClock(); };
  $('bRuler').onclick = () => { RULER.on = !RULER.on; RULER.a = RULER.b = null; $('bRuler').classList.toggle('on', RULER.on); toast(RULER.on ? 'Линейка: отметьте первую точку на карте' : 'Линейка выключена'); requestDraw(); };
  $('bLayers').onclick = () => { $('layers').hidden = !$('layers').hidden; };
  document.querySelectorAll('#layers input').forEach(el => el.onchange = () => { layers[el.dataset.l] = el.checked; if (el.dataset.l === 'changes') buildImage(); invalidate(); });
  $('grab').onclick = () => $('side').classList.toggle('min');
  // встроенный снимок сразу, чтобы карта не была пустой
  const emb = GEO.front;
  FRONT_NOW = { occ: emb.occ, unk: emb.unk, lib: emb.lib || [], ato: emb.ato || [], date: new Date(emb.date + 'T12:00:00'), src: 'demo' };
  setFront(FRONT_NOW);
  if (innerWidth < 760) { view.z = Math.min(innerWidth / 230, 2); view.u = U(36.4); view.v = V(47.5); }
  // после перезагрузки страницы продолжаем то, во что играли последним (свободный режим или кампанию)
  let last = null; try { last = localStorage.getItem(LAST_KEY); } catch (e) { }
  // как в GeoFront: при запуске всегда стартовое меню слева, а справа — живая карта (и прошлая игра, если была)
  if (!(last && load(last))) { renderSide(); if (innerWidth >= 760) view.u -= (menuShift = 250 / view.z); } // карта по центру правой части, пока открыто меню
  showMenu();
  try {
    const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 8000);
    const r = await fetch('https://deepstatemap.live/api/history/last', { signal: ctl.signal, cache: 'no-store' });
    clearTimeout(t);
    if (!r.ok) throw new Error(r.status);
    const fd = parseDeepState(await r.json()); fd.src = 'live';
    FRONT_NOW = fd; if (SCEN.id === 'now') setFront(fd);
  } catch (e) { /* CORS или нет сети — остаёмся на встроенной карте */ }
  refreshMenuSrc();
}
function closeLayers() { $('layers').hidden = true; }
window.__nato = natoSVG; window.__vis = () => UNIT_VIS; window.__game = { get S() { return S; }, get ATK() { return ATK; }, draw, recompute, layers, touch: touchInput, invalidate, forceRender: () => { renderCache(); draw(); }, ASSETS, owner, country, fort, endTurn, startGame, computeStats, CITIES, cellAt, U, V, COLS, ROWS, localInfo, view, requestDraw, get STATS() { return STATS; } };
boot();
