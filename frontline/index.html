<title>Линия фронта</title>
<meta name="description" content="Стратегия на реальной карте фронта DeepState: двигай линию фронта между Украиной и Россией — наступай, укрепляйся, окружай.">

<style>
  :root {
    color-scheme: dark;
    --bg: #0d1117;
    --panel: rgba(16, 21, 29, 0.94);
    --panel-2: #1a222e;
    --line: #2a3546;
    --ink: #e8edf4;
    --muted: #93a1b5;
    --ua: #3b82f6;
    --ua-2: #facc15;
    --ru: #e0352b;
    --grey: #8b8178;
    --ok: #34d399;
    --warn: #fbbf24;
    --head: "Russo One", "Rubik", system-ui, sans-serif;
    --body: "Rubik", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body { background: #a9c4d4; color: var(--ink); font: 14px/1.4 var(--body); -webkit-tap-highlight-color: transparent; }
  canvas#map { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  /* готовая карта: двигается и масштабируется видеокартой, без перерисовки */
  canvas#mapc { position: fixed; left: 0; top: 0; transform-origin: 0 0; pointer-events: none; will-change: transform; }
  canvas#map.paint { cursor: crosshair; }
  button { font: inherit; color: inherit; cursor: pointer; }
  a { color: #93c5fd; }

  #top { position: fixed; top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 10px;
    padding: calc(8px + env(safe-area-inset-top)) 12px 8px; background: linear-gradient(var(--panel), rgba(16,21,29,.75));
    border-bottom: 1px solid var(--line); z-index: 5; }
  .brand { font-family: var(--head); letter-spacing: .06em; font-size: 16px; white-space: nowrap; }
  .brand i { font-style: normal; color: var(--ru); }
  #clock { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #clock b { color: var(--ink); font-weight: 500; }
  .chip { display: inline-block; padding: 1px 8px; border-radius: 99px; background: var(--panel-2); border: 1px solid var(--line); font-size: 12px; margin-left: 6px; }
  .spacer { flex: 1; }
  .tbtn { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; }
  .tbtn:hover { border-color: #46566d; }

  #layers { position: fixed; top: 52px; right: 12px; z-index: 6; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; }
  #layers label { display: flex; gap: 8px; align-items: center; padding: 3px 0; cursor: pointer; }

  #side { position: fixed; top: 58px; right: 12px; bottom: 34px; width: 350px; z-index: 4; background: var(--panel);
    border: 1px solid var(--line); border-radius: 14px; display: flex; flex-direction: column; overflow: hidden; }
  #grab { display: none; }
  #sideBody { overflow-y: auto; padding: 14px; flex: 1; }
  #sideBody h2 { font-family: var(--head); font-size: 15px; margin: 0 0 10px; letter-spacing: .03em; font-weight: 400; }
  #sideBody h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 16px 0 8px; font-weight: 500; }
  .flag { display: inline-block; width: 18px; height: 12px; border-radius: 2px; vertical-align: -1px; margin-right: 6px; }
  .flag.ua { background: linear-gradient(#0057b7 50%, #ffd700 50%); }
  .flag.ru { background: linear-gradient(#fff 33%, #0039a6 33% 66%, #d52b1e 66%); }
  .res { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .res div { background: var(--panel-2); border-radius: 8px; padding: 6px 9px; }
  .res small { display: block; color: var(--muted); font-size: 11px; }
  .res b { font-weight: 500; font-size: 15px; }
  .stat { background: var(--panel-2); border-radius: 8px; padding: 8px 10px; margin-top: 6px; }
  .stat .big { font-size: 18px; font-weight: 500; }
  .up { color: var(--ok); } .down { color: #f87171; }
  .obj { display: flex; flex-wrap: wrap; gap: 6px; }
  .obj span { padding: 2px 8px; border-radius: 99px; background: var(--panel-2); border: 1px solid var(--line); font-size: 12px; }
  .obj span.done { border-color: var(--ok); color: var(--ok); }
  .obj span.lost { border-color: #f87171; color: #f87171; text-decoration: line-through; }
  .op { border: 1px solid #3d4c63; border-radius: 10px; padding: 10px; background: #141b25; }
  .tabs { display: flex; gap: 6px; margin: 8px 0; }
  .tabs button { flex: 1; padding: 6px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel-2); }
  .tabs button.on { background: #24324a; border-color: #4b6a9b; }
  .tabs.grid { display: grid; grid-template-columns: 1fr 1fr; }
  .tabs button:disabled { opacity: .35; cursor: default; }
  .res2 { display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 6px; font-size: 12.5px; color: #c3cddb; }
  .qin { flex: 1; min-width: 0; background: var(--panel-2); color: var(--ink); border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; font: inherit; }
  .sl { display: grid; grid-template-columns: 92px 1fr 64px; align-items: center; gap: 8px; margin: 6px 0; font-size: 13px; }
  .sl output { text-align: right; font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: #60a5fa; }
  .est { margin: 8px 0; padding: 8px; border-radius: 8px; background: var(--panel-2); font-size: 13px; }
  .row { display: flex; gap: 8px; }
  .btn { flex: 1; padding: 9px 12px; border-radius: 9px; border: 1px solid var(--line); background: var(--panel-2); font-weight: 500; }
  .btn.primary { background: #1d4ed8; border-color: #3b82f6; }
  .btn.red { background: #9f1d17; border-color: var(--ru); }
  .btn:disabled { opacity: .45; cursor: default; }
  .orders { list-style: none; padding: 0; margin: 0; }
  .orders li { display: flex; align-items: center; gap: 8px; padding: 6px 8px; background: var(--panel-2); border-radius: 8px; margin-bottom: 5px; font-size: 13px; }
  .orders li span { flex: 1; }
  .orders li button { background: none; border: 0; color: var(--muted); font-size: 16px; padding: 0 4px; }
  .log { font-size: 12.5px; color: #c3cddb; }
  .log p { margin: 0 0 5px; padding-left: 8px; border-left: 3px solid var(--line); }
  .log p.s1 { border-color: var(--ua); } .log p.s2 { border-color: var(--ru); } .log p.ev { border-color: var(--warn); }
  .muted { color: var(--muted); }
  .hint { font-size: 12.5px; color: var(--muted); margin: 6px 0; }
  .tools { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .tools button { padding: 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel-2); }
  .tools button.on { outline: 2px solid #93c5fd; }
  .sw { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }

  #credit { position: fixed; left: 8px; bottom: calc(6px + env(safe-area-inset-bottom)); z-index: 3; font-size: 11px; color: #3b4452;
    background: rgba(255,255,255,.75); padding: 2px 7px; border-radius: 5px; }
  #credit a { color: #1e40af; }
  #legend { position: fixed; left: 8px; bottom: 30px; z-index: 3; font-size: 11.5px; color: #1f2937; background: rgba(255,255,255,.82);
    padding: 6px 9px; border-radius: 8px; line-height: 1.6; }

  #modal { position: fixed; inset: 0; z-index: 20; background: rgba(5,8,12,.62); display: flex; align-items: center; justify-content: center; padding: 16px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; width: min(560px, 100%); max-height: calc(100vh - 32px); overflow-y: auto; padding: 22px; }

  .card .sub { color: var(--muted); margin: 4px 0 16px; }
  .src { background: var(--panel-2); border-radius: 10px; padding: 10px 12px; font-size: 13px; margin-bottom: 14px; }

  .modes button b { display: block; font-size: 15px; margin-bottom: 2px; }
  .modes button small { color: var(--muted); }
  .card details { margin-top: 14px; font-size: 13px; color: #c3cddb; }
  .card summary { cursor: pointer; color: var(--ink); }
  .card select { background: var(--panel-2); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; font: inherit; }
  .rep p { margin: 0 0 6px; }

  #toast { position: fixed; left: 50%; top: 64px; transform: translateX(-50%); z-index: 30; background: #111827; border: 1px solid var(--line);
    padding: 8px 14px; border-radius: 10px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 90vw; }
  #toast.on { opacity: 1; }
  #tip { position: fixed; z-index: 8; pointer-events: none; background: rgba(17,24,39,.92); border: 1px solid var(--line); border-radius: 8px;
    padding: 5px 8px; font-size: 12px; display: none; white-space: nowrap; }

  @media (max-width: 760px) {
    .brand { font-size: 13px; }
    #clock { font-size: 11.5px; }
    .tbtn { padding: 5px 9px; font-size: 13px; }
    #side { left: 0; right: 0; bottom: 0; top: auto; width: auto; height: 46vh; border-radius: 16px 16px 0 0; padding-bottom: env(safe-area-inset-bottom); transition: height .2s; }
    #side.min { height: 92px; }
    #grab { display: block; height: 22px; border: 0; background: none; width: 100%; flex: none; }
    #grab::before { content: ""; display: block; margin: 0 auto; width: 44px; height: 4px; border-radius: 4px; background: #4b5563; }
    #sideBody { padding-top: 0; }
    #credit { bottom: auto; top: calc(48px + env(safe-area-inset-top)); left: 6px; font-size: 10px; }
    #legend { display: none; }
    .modes { grid-template-columns: 1fr; }
  }
</style>
</head>

<div id="modal" hidden><div class="card" id="modalCard"></div></div>
<div id="toast"></div>
<div id="tip"></div>

   Поле — сетка ~2,2 × 2,2 км в проекции Меркатора. Каждая клетка: страна, владелец,
   город, река, укрепления. Все расчёты (бои, окружения, линия фронта) идут по клеткам. */
const BB = { w: 20, e: 50, s: 41, n: 60 }; // игровая область: от Польши до Волги, от Турции до Петербурга
const CD = 0.035, RAD = Math.PI / 180;
const CM = CD * RAD, X0 = BB.w * RAD, Y0 = Math.log(Math.tan(Math.PI / 4 + BB.n * RAD / 2));
const COLS = Math.round((BB.e - BB.w) / CD);
const ROWS = Math.ceil((Y0 - Math.log(Math.tan(Math.PI / 4 + BB.s * RAD / 2))) / CM);
const N = COLS * ROWS;
const U = lon => (lon * RAD - X0) / CM;
const V = lat => (Y0 - Math.log(Math.tan(Math.PI / 4 + lat * RAD / 2))) / CM;
const LON = u => (X0 + u * CM) / RAD;
const LAT = v => (2 * Math.atan(Math.exp(Y0 - v * CM)) - Math.PI / 2) / RAD;
const rowKm2 = new Float32Array(ROWS);
for (let j = 0; j < ROWS; j++) { const c = Math.cos(LAT(j + .5) * RAD) * CD * 111.32; rowKm2[j] = c * c; }

function bindFile() {

  if (fi) fi.onchange = async () => {
    const f = fi.files[0]; if (!f) return;
    try {
      let txt = await f.text();
      const m = txt.match(/<pre[^>]*>([\s\S]*)<\/pre>/i); if (m) txt = m[1].replace(/&quot;/g, '"').replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>');
      const fd = parseDeepState(JSON.parse(txt)); fd.src = 'file'; FRONT_NOW = fd; SCEN.id = 'now'; setFront(fd); toast('Карта DeepState загружена');
    } catch (e) { toast('Не удалось прочитать файл: ' + e.message); }
    showMenu();
  };
}

    </div>

    </div>
    <details><summary>Как играть</summary>

      ✸ <b>«Орешник»</b> (РФ) / <b>залп «Фламинго»</b> (ВСУ) — самый мощный удар, долго перезаряжается.<br>

      🛥 <b>Морские дроны</b> — топят корабли в порту противника.</p>
      <p>«Что захватить?» — напишите город, и войска сами пойдут на него в наступление.</p>
      <p><b>Окружение</b>: группировка, отрезанная от тыла, через 1–3 хода сдаётся. Погода: в распутицу наступления в 1,5 раза слабее. Каждую неделю — пополнения и иногда события.</p>
      <p>Это игра, а не прогноз: цифры условные и упрощённые.</p>

function bindMenu() {
  const card = $('modalCard');
  card.querySelectorAll('[data-go]').forEach(el => el.onclick = () => {
    const g = el.dataset.go;
    if (g === 'ed') { startGame('editor', 0, false); }
    else startGame(g === 'sim' ? 'sim' : 'campaign', g === 'ua' ? UA : g === 'ru' ? RU : 0, false);
  });
  bindFile();
  $('scen').onchange = e => pickScen(e.target.value);
  $('histDate').onchange = e => { SCEN.date = e.target.value; if (SCEN.date) loadHist(SCEN.date); };
  refreshMenuSrc();
  if ($('bResume')) $('bResume').onclick = closeModal;
  if ($('bLoad')) $('bLoad').onclick = () => { if (S) save(); if (load(SAVE_KEY)) closeModal(); else toast('Сохранение повреждено'); };
  if ($('bLoadFree')) $('bLoadFree').onclick = () => { if (S) save(); if (load(FREE_KEY)) closeModal(); else toast('Сохранение повреждено'); };
}
function showReport(rep) {
  const p = S.player, net = rep.gained[p] - rep.gained[3 - p];
  const lines = rep.lines.slice().sort((a, b) => (a.s === p ? 0 : 1) - (b.s === p ? 0 : 1));
  openModal(`<h1 style="font-size:22px">Итоги недели ${S.turn}</h1>
    <div class="sub">${dateStr(S.date)} · ${season(S.date).name}</div>
    <div class="stat"><div class="big ${net >= 0 ? 'up' : 'down'}">${net >= 0 ? '+' : ''}${fmt(net)} км²</div><small class="muted">Ваши продвижения: ${fmt(rep.gained[p])} км² · противника: ${fmt(rep.gained[3 - p])} км²</small></div>
    <div class="log rep" style="margin-top:12px">${lines.map(l => `<p class="${l.ev ? 'ev' : 's' + l.s}">${l.t}</p>`).join('') || '<p>Тихая неделя: активных действий не было.</p>'}</div>
    <button class="btn primary" style="width:100%;margin-top:12px" id="bOk">Продолжить</button>`);
  $('bOk').onclick = closeModal;
}
function showEnd(title, why) {
  const p = S.player, s = S.sides[p];
  openModal(`<h1>${title}</h1><div class="sub">${why}</div>${statBlock()}
    <div class="stat">Недель: ${S.turn} · потери ${SIDE[p].short}: ${fmt(s.lossP)} чел., ${fmt(s.lossA)} ед. техники · противник: ${fmt(S.sides[3 - p].lossP)} чел.</div>
    <div class="row" style="margin-top:12px"><button class="btn primary" id="bNew">Новая игра</button><button class="btn" id="bLook">Смотреть карту</button></div>`);
  $('bNew').onclick = showMenu; $('bLook').onclick = closeModal;
}

/* ================= Сохранение ================= */
const SAVE_KEY = 'frontline-save-v3';
// сжатие повторов: карта большая, без него сохранение не влезает в хранилище браузера
const rleEnc = a => { const o = []; let v = a[0], c = 0; for (let i = 0; i < a.length; i++) { if (a[i] === v) c++; else { o.push(v, c); v = a[i]; c = 1; } } o.push(v, c); return o.join(','); };
const rleDec = (str, a) => { const x = str.split(',').map(Number); let p = 0; for (let i = 0; i < x.length; i += 2) { a.fill(x[i], p, p + x[i + 1]); p += x[i + 1]; } };
const toB64 = a => { const u = new Uint8Array(a.buffer, a.byteOffset, a.byteLength); let s = ''; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); };
const fromB64 = (s, T) => { const b = atob(s), u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return new T(u.buffer); };
// У свободного режима своё сохранение, чтобы кампания его не затирала (и наоборот).
// LAST_KEY помнит, во что играли последним, — после перезагрузки страницы игра продолжает именно это.
const FREE_KEY = 'frontline-free-v1', LAST_KEY = 'frontline-last';
const saveKeyFor = mode => mode === 'editor' ? FREE_KEY : SAVE_KEY;
const hasSaveFor = key => { try { return !!localStorage.getItem(key); } catch (e) { return false; } };
function save() {
  if (!S) return;
  try {
    const st = Object.assign({}, S, { sel: null, draft: null, ed: { side: ED.side, tool: ED.tool, paint: ED.paint, size: ED.size } });
    const key = saveKeyFor(S.mode);
    localStorage.setItem(key, JSON.stringify({ N, S: st, stats0: STATS0, frontDate: +FRONT.date,
      owner: rleEnc(owner), owner0: rleEnc(owner0), fort: rleEnc(fort), changed: rleEnc(changed), cut: rleEnc(cut), grace: rleEnc(grace) }));
    localStorage.setItem(LAST_KEY, key);
  } catch (e) { /* хранилище недоступно — игра просто не сохранится */ }
}
let saveT = 0;
function saveSoon() { clearTimeout(saveT); saveT = setTimeout(save, 700); }
function load(key = SAVE_KEY) {
  try {
    const d = JSON.parse(localStorage.getItem(key));
    if (!d || d.N !== N) return false;
    stopAuto(); ATK = null; LASSO = null; ED.undo = [];
    rleDec(d.owner, owner); rleDec(d.owner0, owner0); rleDec(d.fort, fort); rleDec(d.changed, changed); rleDec(d.cut, cut); rleDec(d.grace, grace);
    S = d.S; STATS0 = d.stats0;
    if (S.ed) Object.assign(ED, S.ed);
    try { localStorage.setItem(LAST_KEY, key); } catch (e) { }
    recompute(); renderAll(); return true;
  } catch (e) { return false; }
}
// вкладку свернули или закрывают — сохраняем сразу (в том числе посреди атаки в свободном режиме)
addEventListener('visibilitychange', () => { if (document.hidden) save(); });
addEventListener('pagehide', save);

/* ================= Запуск ================= */
function setFront(fd) {
  FRONT = fd;
  $('credDate').textContent = (fd.src === 'hist' ? '· архив ' : fd.src === 'scen' ? '· сценарий ' : '· ') + new Date(fd.date).toLocaleDateString('ru-RU');
  if (!S || S.over) { applyFront(fd); owner0.set(owner); initForts(); recompute(); }
}
async function boot() {
  buildBase(); buildPaths(); resize();
  addEventListener('resize', resize);
  $('bMenu').onclick = showMenu;
  $('bPause').onclick = () => { RT.paused = !RT.paused; renderClock(); };
  $('bLayers').onclick = () => { $('layers').hidden = !$('layers').hidden; };
  document.querySelectorAll('#layers input').forEach(el => el.onchange = () => { layers[el.dataset.l] = el.checked; if (el.dataset.l === 'changes') buildImage(); invalidate(); });
  $('grab').onclick = () => $('side').classList.toggle('min');
  // встроенный снимок сразу, чтобы карта не была пустой
  const emb = GEO.front;
  FRONT_NOW = { occ: emb.occ, unk: emb.unk, lib: emb.lib || [], date: new Date(emb.date + 'T12:00:00'), src: 'demo' };
  setFront(FRONT_NOW);
  if (innerWidth < 760) { view.z = Math.min(innerWidth / 230, 2); view.u = U(36.4); view.v = V(47.5); }
  // после перезагрузки страницы продолжаем то, во что играли последним (свободный режим или кампанию)
  let last = null; try { last = localStorage.getItem(LAST_KEY); } catch (e) { }
  if (last && load(last)) toast(S.mode === 'editor' ? 'Продолжаем свободный режим' : 'Продолжаем игру');
  else showMenu();
  try {
    const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 8000);
    const r = await fetch('https://deepstatemap.live/api/history/last', { signal: ctl.signal, cache: 'no-store' });
    clearTimeout(t);
    if (!r.ok) throw new Error(r.status);
    const fd = parseDeepState(await r.json()); fd.src = 'live';
    FRONT_NOW = fd; if (SCEN.id === 'now') setFront(fd);
  } catch (e) { /* CORS или нет сети — остаёмся на встроенной карте */ }
  refreshMenuSrc();
}
function closeLayers() { $('layers').hidden = true; }
window.__game = { get S() { return S; }, get ATK() { return ATK; }, draw, recompute, layers, touch: touchInput, invalidate, forceRender: () => { renderCache(); draw(); }, ASSETS, owner, country, fort, endTurn, startGame, computeStats, CITIES, cellAt, U, V, COLS, ROWS, localInfo, view, requestDraw, get STATS() { return STATS; } };
boot();
