name: Publish school portal

on:
  push:
    branches: [main]
    paths: ["school-portal/public/**", "price-guess/**", "rick-morty/**", "rocket-builder/**", "frontline/**", "podil-dragons/**", "aquarium/**", "evolution/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Портал — в корне сайта, «Угадай цену» — в /price-guess/, «Рик и Морти» — в /rick-morty/, «Ракетостроитель» — в /rocket-builder/, «Линия фронта» — в /frontline/, PODIL DRAGONS — в /podil-dragons/, «Аквариум эволюции» — в /aquarium/, «Эволюция» — в /evolution/
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r school-portal/public/. _site/
          cp -r price-guess _site/price-guess
          cp -r rick-morty _site/rick-morty
          cp -r rocket-builder _site/rocket-builder
          cp -r frontline _site/frontline
          cp -r podil-dragons _site/podil-dragons
          cp -r aquarium _site/aquarium
          cp -r evolution _site/evolution
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
