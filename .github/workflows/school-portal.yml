name: Publish school portal

on:
  push:
    branches: [main]
    paths: ["school-portal/public/**", "price-guess/**", "rick-morty/**", "event-horizon/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Портал — в корне сайта, «Угадай цену» — в /price-guess/, «Рик и Морти» — в /rick-morty/, «Горизонт событий» — в /event-horizon/
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r school-portal/public/. _site/
          cp -r price-guess _site/price-guess
          cp -r rick-morty _site/rick-morty
          cp -r event-horizon _site/event-horizon
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
