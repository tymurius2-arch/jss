name: Build GD AutoBot mod

on:
  push:
    paths: ["gd-autobot/**", ".github/workflows/gd-autobot.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Route search test
        working-directory: gd-autobot/test
        run: |
          g++ -std=c++20 -O2 -Wall -I../mod/src sim_test.cpp ../mod/src/route_search.cpp -o sim_test
          ./sim_test

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          path: gd-autobot/mod

      - uses: actions/upload-artifact@v4
        with:
          name: gd-autobot-mod
          path: ${{ steps.build.outputs.build-output }}/*.geode

      # The launcher downloads the mod from this release (latest build of main or the bot branch).
      - name: Publish release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude/adoring-albattani-ao2m7t'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: gd-autobot-latest
          name: GD AutoBot (latest build)
          body: Mod file for the Geometry Dash AutoBot launcher (gd-autobot/start.bat).
          files: ${{ steps.build.outputs.build-output }}/*.geode
          make_latest: false
